<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Animation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0c0c0c;overflow:hidden;}

.stage{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0c0c0c;gap:20px;
}

.banner{
  position:relative;
  width:min(96vw,1200px);
  aspect-ratio:4.2/1;
  overflow:hidden;
  background:#0c0c0c;
  flex-shrink:0;
}

/* Each piece fills the banner — object-position controls which part shows */
.piece{
  position:absolute;inset:0;
  width:100%;height:100%;
  will-change:transform,opacity;opacity:0;
}
.piece img{
  position:absolute;inset:0;
  width:100%;height:100%;
  /* cover scales the image to fill — object-position shifts the focal point */
  object-fit:cover;
}

/* 
  HANDS — left section, show the upper/right part of the image (the hands reaching up)
  The hands PNG has content in the upper-left triangle area
*/
#p-hands{
  clip-path:polygon(0% 0%, 58% 0%, 44% 100%, 0% 100%);
  transform:translateX(-110%);
}
#p-hands img{object-position:center center;}

/* 
  EYE — upper center-right. The eye PNG has content in the upper area
  Show as a downward-pointing triangle
*/
#p-eye{
  clip-path:polygon(44% 0%, 78% 0%, 64% 100%, 30% 100%);
  transform:translateY(-110%);
}
#p-eye img{object-position:70% 20%;}

/*
  SHADOW — lower center. The shadow PNG has content in the lower area
  Show as an upward-pointing triangle  
*/
#p-shadow{
  clip-path:polygon(30% 0%, 64% 0%, 78% 100%, 44% 100%);
  transform:translateY(110%);
}
#p-shadow img{object-position:60% 80%;}

/* 
  MEGAPHONES — right section
  The megaphones PNG has content in the upper-right triangle
*/
#p-meg{
  clip-path:polygon(64% 0%, 100% 0%, 100% 100%, 78% 100%);
  transform:translateX(110%);
}
#p-meg img{object-position:80% center;}

/* 
  DIAMOND — center overlay
  Clipped to a true diamond/rotated-square shape using clip-path
  The diamond image is already a dark rounded square rotated 45deg
*/
.diamond-wrap{
  position:absolute;
  width:12%;
  aspect-ratio:1;
  top:50%;left:50%;
  /* We rotate the container 45deg to make it a diamond */
  transform:translate(-50%,-50%) rotate(45deg) scale(0);
  opacity:0;z-index:10;
  /* Clip to circle to remove corners after rotation = diamond effect */
  clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}
.diamond-wrap img{
  /* Counter-rotate the image so it appears upright inside the diamond */
  position:absolute;inset:-20%;
  width:140%;height:140%;
  object-fit:cover;
  transform:rotate(-45deg);
}
.diamond-text{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  /* Counter-rotate text to appear upright */
  transform:rotate(-45deg);
  text-align:center;padding:15%;z-index:2;
}
.dt1,.dt2{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(5px,0.9vw,11px);
  letter-spacing:0.06em;line-height:1.4;display:block;
}
.dt1{color:#f5f0e8;}
.dt2{color:#e8c547;}

/* Flying text */
.fly-text{
  position:absolute;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(10px,2vw,30px);
  letter-spacing:0.1em;opacity:0;top:50%;
  white-space:nowrap;pointer-events:none;z-index:20;
}
#ft-human{color:#f5f0e8;left:-120%;transform:translateY(-130%);}
#ft-digital{color:#e8c547;right:-120%;transform:translateY(20%);}

/* Name below banner */
.name-reveal{
  opacity:0;transform:translateY(16px);
  flex-shrink:0;align-self:flex-start;
  padding-left:min(2vw,20px);
}
.name-reveal h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(28px,5.5vw,72px);
  color:#f5f0e8;letter-spacing:0.03em;line-height:0.92;
}
.name-reveal h1 span{color:#e8c547;}
.name-reveal p{
  font-family:'Libre Baskerville',serif;
  font-size:clamp(10px,1vw,14px);
  font-style:italic;color:#8a8478;margin-top:6px;line-height:1.7;
}

.replay-btn{
  position:fixed;bottom:16px;right:16px;
  font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:0.12em;
  color:#8a8478;background:transparent;
  border:1px solid rgba(255,255,255,0.12);
  padding:7px 14px;cursor:pointer;
  opacity:0;transition:opacity 0.3s,color 0.2s;z-index:100;
}
.replay-btn:hover{color:#e8c547;}
.replay-btn.show{opacity:1;}
.debug-btn{
  position:fixed;bottom:16px;left:16px;
  font-family:'Bebas Neue',sans-serif;font-size:11px;
  letter-spacing:0.12em;color:#555;background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  padding:7px 14px;cursor:pointer;z-index:100;transition:color 0.2s;
}
.debug-btn:hover{color:#e8c547;}
</style>
</head>
<body>
<div class="stage">
  <div class="banner" id="banner">

    <div class="piece" id="p-hands">
      <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351224/Untitled_design_-_2026-05-09T200349.357_lrwncb.png" alt=""/>
    </div>
    <div class="piece" id="p-eye">
      <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351195/Untitled_design_-_2026-05-09T200227.598_ryjhh2.png" alt=""/>
    </div>
    <div class="piece" id="p-shadow">
      <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351437/Untitled_design_-_2026-05-09T202926.420_w25jow.png" alt=""/>
    </div>
    <div class="piece" id="p-meg">
      <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778350882/Untitled_design_-_2026-05-09T200144.004_qpqw2p.png" alt=""/>
    </div>

    <div class="diamond-wrap" id="dWrap">
      <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351266/Untitled_design_-_2026-05-09T200500.817_ovt7uu.png" alt=""/>
      <div class="diamond-text">
        <span class="dt1">HUMAN STORIES.</span>
        <span class="dt2">DIGITAL SPACES.</span>
      </div>
    </div>

    <div class="fly-text" id="ft-human">HUMAN STORIES.</div>
    <div class="fly-text" id="ft-digital">DIGITAL SPACES.</div>

  </div>

  <div class="name-reveal" id="nameReveal">
    <h1>LINDSEY<br>BROCK<br><span>MORALES</span></h1>
    <p>Editorial designer & data journalist — Bologna, IT & Washington DC</p>
  </div>
</div>

<button class="replay-btn" id="replayBtn" onclick="run()">↺ Replay</button>
<button class="debug-btn" id="debugBtn" onclick="toggleDebug()">Show assembled</button>

<script>
const $=id=>document.getElementById(id);
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
const ease='cubic-bezier(0.16,1,0.3,1)';
let debugMode=false;

function set(el,styles,tr){
  if(tr!==undefined)el.style.transition=tr;
  Object.assign(el.style,styles);
}

function resetAll(){
  set($('p-hands'),{transform:'translateX(-110%)',opacity:'0'},'none');
  set($('p-eye'),{transform:'translateY(-110%)',opacity:'0'},'none');
  set($('p-shadow'),{transform:'translateY(110%)',opacity:'0'},'none');
  set($('p-meg'),{transform:'translateX(110%)',opacity:'0'},'none');
  set($('dWrap'),{transform:'translate(-50%,-50%) rotate(45deg) scale(0)',opacity:'0'},'none');
  set($('ft-human'),{left:'-120%',opacity:'0',transform:'translateY(-130%)'},'none');
  set($('ft-digital'),{right:'-120%',opacity:'0',transform:'translateY(20%)'},'none');
  set($('nameReveal'),{opacity:'0',transform:'translateY(16px)'},'none');
}

function toggleDebug(){
  debugMode=!debugMode;
  $('debugBtn').textContent=debugMode?'Hide assembled':'Show assembled';
  if(debugMode){
    ['p-hands','p-eye','p-shadow','p-meg'].forEach(id=>{
      const el=$(id);
      el.style.transition='none';
      el.style.transform='none';
      el.style.opacity='1';
    });
    set($('dWrap'),{
      transform:'translate(-50%,-50%) rotate(45deg) scale(1)',
      opacity:'1'
    },'none');
    set($('nameReveal'),{opacity:'1',transform:'translateY(0)'},'none');
  } else {
    run();
  }
}

async function run(){
  $('replayBtn').classList.remove('show');
  debugMode=false;
  $('debugBtn').textContent='Show assembled';
  resetAll();
  await wait(400);

  set($('p-hands'),{transform:'translateX(0)',opacity:'1'},`all 850ms ${ease}`);
  await wait(80);
  set($('p-meg'),{transform:'translateX(0)',opacity:'1'},`all 850ms ${ease}`);
  await wait(80);
  set($('p-eye'),{transform:'translateY(0)',opacity:'1'},`all 850ms ${ease}`);
  await wait(80);
  set($('p-shadow'),{transform:'translateY(0)',opacity:'1'},`all 850ms ${ease}`);
  await wait(650);

  set($('dWrap'),{
    transform:'translate(-50%,-50%) rotate(45deg) scale(1)',opacity:'1'
  },`all 600ms ${ease}`);

  await wait(1000);

  set($('ft-human'),{left:'4%',opacity:'1'},`all 600ms ${ease}`);
  await wait(100);
  set($('ft-digital'),{right:'4%',opacity:'1'},`all 600ms ${ease}`);

  await wait(1600);

  set($('ft-human'),{opacity:'0',left:'-20%'},'all 400ms ease-in');
  set($('ft-digital'),{opacity:'0',right:'-20%'},'all 400ms ease-in');

  await wait(450);

  set($('nameReveal'),{opacity:'1',transform:'translateY(0)'},`all 750ms ${ease}`);

  await wait(800);
  $('replayBtn').classList.add('show');
}

window.addEventListener('load',()=>setTimeout(run,500));
</script>
</body>
</html>
