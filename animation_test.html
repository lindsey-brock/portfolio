<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Animation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0c0c0c;overflow:hidden;}

.stage{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:#0c0c0c;
  display:flex;align-items:center;justify-content:center;
}

/* Each piece fills the full stage and is clipped to its shape */
.piece{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  will-change:transform,opacity;
  opacity:0;
}
.piece img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Clip paths matching the LinkedIn banner diagonal layout */
#p-hands{
  clip-path:polygon(0% 0%, 68% 0%, 52% 100%, 0% 100%);
  transform:translateX(-110%);
}
#p-shadow{
  clip-path:polygon(42% 0%, 82% 0%, 68% 100%, 28% 100%);
  transform:translateY(110%);
}
#p-eye{
  clip-path:polygon(62% 0%, 82% 0%, 100% 100%, 78% 100%);
  transform:translateX(110%);
}
#p-meg{
  clip-path:polygon(80% 0%, 100% 0%, 100% 100%, 64% 100%);
  transform:translateX(110%);
}

/* Diamond center piece */
.diamond-wrap{
  position:absolute;
  width:16%;
  aspect-ratio:1;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(45deg) scale(0);
  opacity:0;
  will-change:transform,opacity;
  z-index:10;
}
.diamond-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}
.diamond-text{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:rotate(-45deg);
  text-align:center;
  padding:10%;
}
.dt1,.dt2{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(9px,1.6vw,20px);
  letter-spacing:0.08em;
  line-height:1.3;
  display:block;
}
.dt1{color:#f5f0e8;}
.dt2{color:#e8c547;}

/* Flying text — arrives from opposite sides */
.fly-text{
  position:absolute;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(24px,4.5vw,72px);
  letter-spacing:0.1em;
  opacity:0;
  top:50%;
  white-space:nowrap;
  pointer-events:none;
  z-index:20;
}
#ft-human{
  color:#f5f0e8;
  left:-120%;
  transform:translateY(-130%);
}
#ft-digital{
  color:#e8c547;
  right:-120%;
  transform:translateY(20%);
}

/* Final big slogan */
.final-slogan{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.2);
  opacity:0;
  text-align:center;
  pointer-events:none;
  z-index:30;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:0.1em;
  line-height:1.0;
}
.fs1{
  display:block;
  font-size:clamp(36px,6vw,96px);
  color:#f5f0e8;
}
.fs2{
  display:block;
  font-size:clamp(36px,6vw,96px);
  color:#e8c547;
}

/* Name reveal — appears after slogan */
.name-reveal{
  position:absolute;
  bottom:10vh;
  left:5vw;
  opacity:0;
  transform:translateY(30px);
  z-index:40;
  will-change:opacity,transform;
}
.name-reveal h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(48px,9vw,120px);
  color:#f5f0e8;
  letter-spacing:0.03em;
  line-height:0.92;
}
.name-reveal h1 span{color:#e8c547;}
.name-reveal p{
  font-family:'Libre Baskerville',serif;
  font-size:clamp(12px,1.2vw,16px);
  font-style:italic;
  color:#8a8478;
  margin-top:12px;
  line-height:1.7;
}

/* Replay button */
.replay-btn{
  position:fixed;
  bottom:20px;right:20px;
  font-family:'Bebas Neue',sans-serif;
  font-size:12px;letter-spacing:0.12em;
  color:#8a8478;background:transparent;
  border:1px solid rgba(255,255,255,0.12);
  padding:8px 16px;cursor:pointer;
  opacity:0;transition:opacity 0.3s,color 0.2s;
  z-index:100;
}
.replay-btn:hover{color:#e8c547;}
.replay-btn.show{opacity:1;}

/* Debug toggle */
.debug-btn{
  position:fixed;
  bottom:20px;left:20px;
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:0.12em;
  color:#444;background:transparent;
  border:1px solid rgba(255,255,255,0.06);
  padding:8px 16px;cursor:pointer;
  z-index:100;
  transition:color 0.2s;
}
.debug-btn:hover{color:#666;}
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Image pieces — each fills stage, clipped to shape -->
  <div class="piece" id="p-hands">
    <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351224/Untitled_design_-_2026-05-09T200349.357_lrwncb.png" alt=""/>
  </div>
  <div class="piece" id="p-shadow">
    <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351437/Untitled_design_-_2026-05-09T202926.420_w25jow.png" alt=""/>
  </div>
  <div class="piece" id="p-eye">
    <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351195/Untitled_design_-_2026-05-09T200227.598_ryjhh2.png" alt=""/>
  </div>
  <div class="piece" id="p-meg">
    <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778350882/Untitled_design_-_2026-05-09T200144.004_qpqw2p.png" alt=""/>
  </div>

  <!-- Diamond center with text -->
  <div class="diamond-wrap" id="dWrap">
    <img src="https://res.cloudinary.com/dmegrbq5k/image/upload/v1778351266/Untitled_design_-_2026-05-09T200500.817_ovt7uu.png" alt=""/>
    <div class="diamond-text">
      <span class="dt1">HUMAN STORIES.</span>
      <span class="dt2">DIGITAL SPACES.</span>
    </div>
  </div>

  <!-- Flying text phase -->
  <div class="fly-text" id="ft-human">HUMAN STORIES.</div>
  <div class="fly-text" id="ft-digital">DIGITAL SPACES.</div>

  <!-- Final growing slogan -->
  <div class="final-slogan" id="fSlogan">
    <span class="fs1">HUMAN STORIES.</span>
    <span class="fs2">DIGITAL SPACES.</span>
  </div>

  <!-- Name reveal -->
  <div class="name-reveal" id="nameReveal">
    <h1>LINDSEY<br>BROCK<br><span>MORALES</span></h1>
    <p>Editorial designer & data journalist<br>Bologna, IT & Washington DC</p>
  </div>

</div>

<button class="replay-btn" id="replayBtn" onclick="run()">↺ Replay</button>
<button class="debug-btn" id="debugBtn" onclick="toggleDebug()">Show assembled</button>

<script>
const $=id=>document.getElementById(id);
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
const ease='cubic-bezier(0.16,1,0.3,1)';
let debugMode=false;

function set(el,styles,tr){
  if(tr!==undefined)el.style.transition=tr;
  Object.assign(el.style,styles);
}

function toggleDebug(){
  debugMode=!debugMode;
  const btn=$('debugBtn');
  const pieces=['p-hands','p-shadow','p-eye','p-meg'];
  if(debugMode){
    btn.textContent='Hide assembled';
    pieces.forEach(id=>{
      const el=$(id);
      el.style.transition='none';
      el.style.transform='none';
      el.style.opacity='1';
    });
    set($('dWrap'),{
      transform:'translate(-50%,-50%) rotate(45deg) scale(1)',
      opacity:'1'
    },'none');
  } else {
    btn.textContent='Show assembled';
    run();
  }
}

async function run(){
  $('replayBtn').classList.remove('show');
  debugMode=false;
  $('debugBtn').textContent='Show assembled';

  const hands=$('p-hands'), shadow=$('p-shadow'),
        eye=$('p-eye'), meg=$('p-meg'),
        dWrap=$('dWrap'),
        ftH=$('ft-human'), ftD=$('ft-digital'),
        fs=$('fSlogan'), name=$('nameReveal');

  // Reset all
  [hands,shadow,eye,meg].forEach(el=>{
    el.style.transition='none';
    el.style.opacity='0';
  });
  set(hands,{transform:'translateX(-110%)'},'none');
  set(shadow,{transform:'translateY(110%)'},'none');
  set(eye,{transform:'translateX(110%)'},'none');
  set(meg,{transform:'translateX(110%)'},'none');
  set(dWrap,{transform:'translate(-50%,-50%) rotate(45deg) scale(0)',opacity:'0'},'none');
  set(ftH,{left:'-120%',opacity:'0',transform:'translateY(-130%)'},'none');
  set(ftD,{right:'-120%',opacity:'0',transform:'translateY(20%)'},'none');
  set(fs,{transform:'translate(-50%,-50%) scale(0.2)',opacity:'0'},'none');
  set(name,{opacity:'0',transform:'translateY(30px)'},'none');

  await wait(400);

  // Phase 1 — pieces assemble
  set(hands,{transform:'translateX(0)',opacity:'1'},`all 900ms ${ease}`);
  await wait(120);
  set(meg,{transform:'translateX(0)',opacity:'1'},`all 900ms ${ease}`);
  await wait(80);
  set(eye,{transform:'translateX(0)',opacity:'1'},`all 900ms ${ease}`);
  await wait(100);
  set(shadow,{transform:'translateY(0)',opacity:'1'},`all 900ms ${ease}`);
  await wait(700);
  set(dWrap,{
    transform:'translate(-50%,-50%) rotate(45deg) scale(1)',
    opacity:'1'
  },`all 700ms ${ease}`);

  await wait(1300);

  // Phase 2 — text flies in from opposite sides
  set(ftH,{left:'6%',opacity:'1'},`all 700ms ${ease}`);
  await wait(120);
  set(ftD,{right:'6%',opacity:'1'},`all 700ms ${ease}`);

  await wait(1600);

  // Phase 3 — everything dissolves
  set(hands,{opacity:'0',transform:'translateX(-20%) scale(0.95)'},'all 500ms ease-in');
  set(meg,{opacity:'0',transform:'translateX(20%) scale(0.95)'},'all 500ms ease-in');
  set(eye,{opacity:'0',transform:'translateX(20%) scale(0.95)'},'all 500ms ease-in');
  set(shadow,{opacity:'0',transform:'translateY(15%) scale(0.95)'},'all 500ms ease-in');
  set(dWrap,{
    opacity:'0',
    transform:'translate(-50%,-50%) rotate(45deg) scale(0.4)'
  },'all 400ms ease-in');
  set(ftH,{opacity:'0',left:'-30%'},'all 400ms ease-in');
  set(ftD,{opacity:'0',right:'-30%'},'all 400ms ease-in');

  await wait(550);

  // Phase 4 — slogan grows and stays
  set(fs,{
    transform:'translate(-50%,-50%) scale(1)',
    opacity:'1'
  },`opacity 400ms ease, transform 800ms ${ease}`);
  await wait(700);
  set(fs,{
    transform:'translate(-50%,-50%) scale(1.15)'
  },'transform 900ms cubic-bezier(0.34,1.4,0.64,1)');

  await wait(800);

  // Phase 5 — slogan shifts up, name reveals
  set(fs,{
    transform:'translate(-50%,-75%) scale(0.7)'
  },'transform 600ms ease-out');

  await wait(300);
  set(name,{opacity:'1',transform:'translateY(0)'},`all 800ms ${ease}`);

  await wait(900);
  $('replayBtn').classList.add('show');
}

window.addEventListener('load',()=>setTimeout(run,500));
</script>
</body>
</html>
