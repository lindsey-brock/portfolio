<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Animation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0c0c0c;overflow:hidden;}

/* Full screen hero — matches portfolio exactly */
.hero{
  width:100vw;height:100vh;
  position:relative;
  overflow:hidden;
  background:#0c0c0c;
}

/* Particle canvas background */
canvas#bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0.4;
}

/* Dark gradient overlay */
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(12,12,12,0.95) 0%,rgba(12,12,12,0.3) 60%,transparent 100%);
  z-index:1;
}

/* Gold/red rule at top */
.hero-rule{
  position:absolute;top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,#e8c547,#c94040,#e8c547);
  z-index:2;
}

/* VIDEO OVERLAY — full width, sits over everything */
.video-overlay{
  position:absolute;inset:0;
  z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:#0c0c0c;
  transition:opacity 0.8s ease;
}
.video-overlay.fade-out{
  opacity:0;
  pointer-events:none;
}

video{
  width:100%;height:100%;
  object-fit:cover;
  mix-blend-mode:screen;
  display:block;
}

/* HERO CONTENT — exactly matching portfolio layout */
.hero-content{
  position:absolute;
  bottom:64px;left:48px;right:48px;
  z-index:3;
}
.hero-edition{
  font-family:'DM Sans',sans-serif;
  font-size:10px;font-weight:500;
  letter-spacing:0.2em;text-transform:uppercase;
  color:#e8c547;margin-bottom:24px;
  opacity:0;transform:translateY(20px);
  transition:opacity 0.8s ease,transform 0.8s ease;
}
.hero-edition.show{opacity:1;transform:translateY(0);}

.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(72px,12vw,160px);
  line-height:0.92;letter-spacing:0.02em;
  overflow:hidden;
}
.hero-title-line{display:block;overflow:hidden;}
.hero-title-inner{
  display:block;
  transform:translateY(100%);
  transition:transform 0.9s cubic-bezier(0.16,1,0.3,1);
}
.hero-title-inner.show{transform:translateY(0);}
.hero-title-line:nth-child(3) .hero-title-inner{color:#e8c547;}

.hero-meta{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-top:32px;padding-top:24px;
  border-top:1px solid rgba(245,240,232,0.1);
  opacity:0;transform:translateY(20px);
  transition:opacity 0.8s ease,transform 0.8s ease;
}
.hero-meta.show{opacity:1;transform:translateY(0);}
.hero-desc{
  font-family:'Libre Baskerville',serif;
  font-size:16px;font-style:italic;
  color:#8a8478;max-width:480px;line-height:1.7;
}
.hero-scroll{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-family:'DM Sans',sans-serif;
  font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:#8a8478;
}
.scroll-line{
  width:1px;height:48px;background:#8a8478;
  animation:scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse{
  0%,100%{transform:scaleY(1);opacity:0.5;}
  50%{transform:scaleY(0.5);opacity:1;}
}

.replay-btn{
  position:fixed;bottom:16px;right:16px;
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:0.12em;
  color:#8a8478;background:transparent;
  border:1px solid rgba(255,255,255,0.12);
  padding:7px 14px;cursor:pointer;
  opacity:0;transition:opacity 0.3s,color 0.2s;z-index:100;
}
.replay-btn:hover{color:#e8c547;}
.replay-btn.show{opacity:1;}

@media(max-width:768px){
  .hero-content{bottom:48px;left:24px;right:24px;}
}
</style>
</head>
<body>

<div class="hero">
  <canvas id="bg"></canvas>
  <div class="hero-overlay"></div>
  <div class="hero-rule"></div>

  <!-- VIDEO OVERLAY — plays first, then fades out -->
  <div class="video-overlay" id="videoOverlay">
    <video id="heroVideo" autoplay muted playsinline preload="auto">
      <source src="https://res.cloudinary.com/dmegrbq5k/video/upload/v1778357984/Copy_of_Summer_Video_2_htexds.mp4" type="video/mp4"/>
    </video>
  </div>

  <!-- HERO CONTENT — revealed after video -->
  <div class="hero-content">
    <div class="hero-edition" id="heroEdition">Editorial Designer & Data Journalist — Bologna, IT & Washington DC</div>
    <h1 class="hero-title">
      <span class="hero-title-line"><span class="hero-title-inner" id="ht1">LINDSEY</span></span>
      <span class="hero-title-line"><span class="hero-title-inner" id="ht2">BROCK</span></span>
      <span class="hero-title-line"><span class="hero-title-inner" id="ht3">MORALES</span></span>
    </h1>
    <div class="hero-meta" id="heroMeta">
      <p class="hero-desc">Working at the intersection of politics, science, and community — making complex information impossible to ignore.</p>
      <div class="hero-scroll">
        <div class="scroll-line"></div>
        <span>Scroll</span>
      </div>
    </div>
  </div>
</div>

<button class="replay-btn" id="replayBtn" onclick="replay()">↺ Replay</button>

<script>
/* Particle background */
(function(){
  const c=document.getElementById('bg');
  const ctx=c.getContext('2d');
  let w,h,particles=[];
  function resize(){w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<120;i++){
    particles.push({
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      r:Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.3,
      vy:-(Math.random()*0.4+0.1),
      alpha:Math.random()*0.6+0.2
    });
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(232,197,71,${p.alpha})`;ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.y<0){p.y=h;p.x=Math.random()*w;}
      if(p.x<0||p.x>w)p.vx*=-1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const video=document.getElementById('heroVideo');
const overlay=document.getElementById('videoOverlay');
const btn=document.getElementById('replayBtn');
const ease=t=>t<0.5?2*t*t:(4-2*t)*t-1;

function revealHero(){
  overlay.classList.add('fade-out');

  setTimeout(()=>{
    document.getElementById('heroEdition').classList.add('show');
  },300);
  setTimeout(()=>{
    document.getElementById('ht1').classList.add('show');
  },500);
  setTimeout(()=>{
    document.getElementById('ht2').classList.add('show');
  },650);
  setTimeout(()=>{
    document.getElementById('ht3').classList.add('show');
  },800);
  setTimeout(()=>{
    document.getElementById('heroMeta').classList.add('show');
  },1100);
  setTimeout(()=>{
    btn.classList.add('show');
  },2000);
}

video.addEventListener('ended', revealHero);

function replay(){
  btn.classList.remove('show');
  ['heroEdition','heroMeta'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
  ['ht1','ht2','ht3'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
  overlay.style.transition='none';
  overlay.classList.remove('fade-out');
  overlay.style.opacity='1';
  setTimeout(()=>{
    overlay.style.transition='opacity 0.8s ease';
    video.currentTime=0;
    video.play();
  },100);
}
</script>
</body>
</html>
