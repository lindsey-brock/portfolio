<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Animation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0c0c0c;overflow:hidden;}

.stage{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0c0c0c;
  gap:20px;
}

.video-wrap{
  position:relative;
  width:min(96vw,1200px);
  flex-shrink:0;
}

video{
  width:100%;
  display:block;
  /* No controls, no UI — pure visual */
}

.name-reveal{
  opacity:0;
  transform:translateY(16px);
  flex-shrink:0;
  align-self:flex-start;
  padding-left:min(2vw,20px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
.name-reveal.show{
  opacity:1;
  transform:translateY(0);
}
.name-reveal h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(28px,5.5vw,72px);
  color:#f5f0e8;
  letter-spacing:0.03em;
  line-height:0.92;
}
.name-reveal h1 span{color:#e8c547;}
.name-reveal p{
  font-family:'Libre Baskerville',serif;
  font-size:clamp(10px,1vw,14px);
  font-style:italic;
  color:#8a8478;
  margin-top:6px;
  line-height:1.7;
}

.replay-btn{
  position:fixed;bottom:16px;right:16px;
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:0.12em;
  color:#8a8478;background:transparent;
  border:1px solid rgba(255,255,255,0.12);
  padding:7px 14px;cursor:pointer;
  opacity:0;transition:opacity 0.3s,color 0.2s;
  z-index:100;
}
.replay-btn:hover{color:#e8c547;}
.replay-btn.show{opacity:1;}
</style>
</head>
<body>

<div class="stage">
  <div class="video-wrap">
    <video
      id="heroVideo"
      autoplay
      muted
      playsinline
      preload="auto">
      <source src="https://res.cloudinary.com/dmegrbq5k/video/upload/v1778355887/Copy_of_Summer_Video_rpzxot.mp4" type="video/mp4"/>
    </video>
  </div>

  <div class="name-reveal" id="nameReveal">
    <h1>LINDSEY<br>BROCK<br><span>MORALES</span></h1>
    <p>Editorial designer & data journalist — Bologna, IT & Washington DC</p>
  </div>
</div>

<button class="replay-btn" id="replayBtn" onclick="replay()">↺ Replay</button>

<script>
const video = document.getElementById('heroVideo');
const name = document.getElementById('nameReveal');
const btn = document.getElementById('replayBtn');

video.addEventListener('ended', () => {
  name.classList.add('show');
  setTimeout(()=>btn.classList.add('show'), 800);
});

function replay(){
  btn.classList.remove('show');
  name.classList.remove('show');
  video.currentTime = 0;
  video.play();
}
</script>
</body>
</html>
