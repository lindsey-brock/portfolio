<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero Animation Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0c0c0c;overflow:hidden;}

.hero{
  width:100vw;height:100vh;
  position:relative;
  display:flex;flex-direction:column;
  justify-content:flex-end;
  padding:0 48px 64px;
  background:#0c0c0c;
}

/* Layout: video left, slogan right — side by side */
.hero-content{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:40px;
  position:relative;
  z-index:2;
}

.hero-left{
  display:flex;
  flex-direction:column;
  gap:0;
  flex:1;
  min-width:0;
}

/* Video container — black bg removed via mix-blend-mode */
.video-wrap{
  position:relative;
  width:100%;
  max-width:560px;
  margin-bottom:-8px;
}

video{
  width:100%;
  display:block;
  /* screen blend mode: black = transparent, colors show through */
  mix-blend-mode:screen;
}

/* Name — hidden until video ends */
.name-block{
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
.name-block.show{
  opacity:1;
  transform:translateY(0);
}
.name-block h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,9vw,120px);
  color:#f5f0e8;
  letter-spacing:0.02em;
  line-height:0.92;
}
.name-block h1 span{color:#e8c547;}

/* Slogan — right side, vertically centered with the video */
.hero-right{
  flex-shrink:0;
  text-align:right;
  padding-bottom:8px;
}
.slogan{
  opacity:0;
  transform:translateX(20px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
.slogan.show{opacity:1;transform:translateX(0);}
.slogan-line1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(20px,2.8vw,40px);
  color:#f5f0e8;
  letter-spacing:0.06em;
  line-height:1.1;
  display:block;
}
.slogan-line2{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(20px,2.8vw,40px);
  color:#e8c547;
  letter-spacing:0.06em;
  line-height:1.1;
  display:block;
}
.slogan-desc{
  font-family:'Libre Baskerville',serif;
  font-size:clamp(11px,1vw,14px);
  font-style:italic;
  color:#8a8478;
  margin-top:12px;
  line-height:1.7;
  display:block;
}

/* Bottom border line */
.hero-rule{
  width:100%;
  height:1px;
  background:rgba(245,240,232,0.1);
  margin-bottom:24px;
  opacity:0;
  transition:opacity 0.8s ease;
}
.hero-rule.show{opacity:1;}

/* Replay */
.replay-btn{
  position:fixed;bottom:16px;right:16px;
  font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:0.12em;
  color:#8a8478;background:transparent;
  border:1px solid rgba(255,255,255,0.12);
  padding:7px 14px;cursor:pointer;
  opacity:0;transition:opacity 0.3s,color 0.2s;z-index:100;
}
.replay-btn:hover{color:#e8c547;}
.replay-btn.show{opacity:1;}

@media(max-width:768px){
  .hero{padding:0 24px 48px;}
  .hero-content{flex-direction:column;align-items:flex-start;gap:16px;}
  .hero-right{text-align:left;}
  .video-wrap{max-width:100%;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-rule" id="heroRule"></div>
  <div class="hero-content">

    <div class="hero-left">
      <div class="video-wrap">
        <video
          id="heroVideo"
          autoplay
          muted
          playsinline
          preload="auto">
          <source src="https://res.cloudinary.com/dmegrbq5k/video/upload/v1778357984/Copy_of_Summer_Video_2_htexds.mp4" type="video/mp4"/>
        </video>
      </div>
      <div class="name-block" id="nameBlock">
        <h1>LINDSEY<br>BROCK<br><span>MORALES</span></h1>
      </div>
    </div>

    <div class="hero-right">
      <div class="slogan" id="slogan">
        <span class="slogan-line1">HUMAN STORIES.</span>
        <span class="slogan-line2">DIGITAL SPACES.</span>
        <span class="slogan-desc">Editorial designer & data journalist<br>Bologna, IT & Washington DC</span>
      </div>
    </div>

  </div>
</div>

<button class="replay-btn" id="replayBtn" onclick="replay()">↺ Replay</button>

<script>
const video = document.getElementById('heroVideo');
const nameBlock = document.getElementById('nameBlock');
const slogan = document.getElementById('slogan');
const rule = document.getElementById('heroRule');
const btn = document.getElementById('replayBtn');

video.addEventListener('ended', () => {
  nameBlock.classList.add('show');
  slogan.classList.add('show');
  rule.classList.add('show');
  setTimeout(()=>btn.classList.add('show'), 1000);
});

function replay(){
  btn.classList.remove('show');
  nameBlock.classList.remove('show');
  slogan.classList.remove('show');
  rule.classList.remove('show');
  video.currentTime = 0;
  video.play();
}
</script>
</body>
</html>
